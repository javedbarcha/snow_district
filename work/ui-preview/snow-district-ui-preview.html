<div id="snow-district-preview" aria-label="Snow District production UI preview">
  <style>
    #snow-district-preview{--sd-navy:#102b40;--sd-deep:#091d2d;--sd-paper:#f0f6fa;--sd-white:#fff;--sd-ink:#142e43;--sd-muted:#5a7181;--sd-line:#c9d8e2;--sd-yellow:#ffbd17;--sd-green:#28785b;--sd-radius:12px;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--sd-ink);width:100%;font-size:14px;line-height:1.45}
    #snow-district-preview *{box-sizing:border-box}
    #snow-district-preview button,#snow-district-preview select,#snow-district-preview input{font:inherit}
    #snow-district-preview button{cursor:pointer}
    #snow-district-preview button:focus-visible,#snow-district-preview select:focus-visible{outline:3px solid var(--sd-yellow);outline-offset:3px}
    #snow-district-preview button:disabled{cursor:default;opacity:.58}
    #snow-district-preview .sd-preview-tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 12px;color:inherit}
    #snow-district-preview .sd-preview-tools>span{font-size:12px;letter-spacing:.08em;font-weight:700;color:#688191}
    #snow-district-preview .sd-preview-tools select{padding:8px 32px 8px 12px;border:1px solid #b9cbd7;border-radius:8px;background:#edf3f7;color:#17334a;min-height:36px}
    #snow-district-preview .sd-game{position:relative;background:var(--sd-paper);border-radius:var(--sd-radius);overflow:hidden;isolation:isolate;box-shadow:0 16px 48px #06172929}
    #snow-district-preview .sd-header{min-height:75px;background:var(--sd-navy);color:var(--sd-white);display:flex;align-items:center;gap:15px;padding:14px 4.5%;border-bottom:3px solid var(--sd-yellow)}
    #snow-district-preview .sd-brand{background:none;border:0;color:inherit;padding:0;display:flex;align-items:center;gap:9px;text-align:left;white-space:nowrap}
    #snow-district-preview .sd-brand-mark{color:var(--sd-yellow);display:flex;align-items:center}
    #snow-district-preview .sd-brand-mark svg{width:32px;height:32px}
    #snow-district-preview .sd-brand strong{font-size:clamp(17px,2.6vw,25px);font-weight:900;font-style:italic;letter-spacing:-.05em;line-height:1.05;display:block}
    #snow-district-preview .sd-brand small{font-size:9px;font-weight:600;letter-spacing:.29em;opacity:.65;display:block;margin-top:4px}
    #snow-district-preview .sd-header-right{margin-left:auto;display:flex;gap:9px;align-items:center}
    #snow-district-preview .sd-wallet{font-weight:800;display:flex;align-items:center;gap:7px;color:var(--sd-yellow);padding:5px 8px;white-space:nowrap}
    #snow-district-preview .sd-square{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;min-height:38px;border-radius:8px;border:1px solid #6f879a;background:#1b3a51;color:var(--sd-white);padding:8px}
    #snow-district-preview .sd-square svg{width:18px;height:18px}
    #snow-district-preview .sd-back{border:0;background:transparent;color:var(--sd-muted);display:flex;align-items:center;gap:7px;padding:0;min-height:30px;font-weight:650;font-size:12px}
    #snow-district-preview .sd-back svg{width:15px;height:15px}
    #snow-district-preview #sd-page{min-height:485px}
    #snow-district-preview .sd-page-inner{padding:22px 4.5% 26px;min-height:485px}
    #snow-district-preview .sd-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:10px 0 20px}
    #snow-district-preview h1,#snow-district-preview h2,#snow-district-preview h3,#snow-district-preview p{margin:0}
    #snow-district-preview h1{font-size:clamp(24px,3.5vw,34px);font-weight:850;letter-spacing:-.045em;line-height:1.1}
    #snow-district-preview h2{font-size:23px;line-height:1.15;letter-spacing:-.035em;font-weight:800}
    #snow-district-preview h3{font-size:17px;line-height:1.2;font-weight:800;letter-spacing:-.025em}
    #snow-district-preview .sd-eyebrow{font-size:10px;letter-spacing:.19em;font-weight:800;color:var(--sd-muted);text-transform:uppercase;margin-bottom:7px}
    #snow-district-preview .sd-sub{color:var(--sd-muted);font-size:12px;margin-top:7px}
    #snow-district-preview .sd-primary,#snow-district-preview .sd-secondary,#snow-district-preview .sd-danger{min-height:42px;padding:11px 19px;border-radius:7px;border:0;font-weight:850;display:inline-flex;gap:9px;align-items:center;justify-content:center;text-align:center;transition:filter .15s,transform .15s}
    #snow-district-preview .sd-primary{color:var(--sd-deep);background:var(--sd-yellow);box-shadow:0 3px 0 #d79708}
    #snow-district-preview .sd-secondary{color:var(--sd-ink);background:#e2ecf2;border:1px solid #c6d8e3}
    #snow-district-preview .sd-danger{background:#fff0ed;color:#a23322;border:1px solid #f2c6bd}
    #snow-district-preview .sd-primary:hover,#snow-district-preview .sd-secondary:hover{filter:brightness(1.05);transform:translateY(-1px)}
    #snow-district-preview .sd-primary svg,#snow-district-preview .sd-secondary svg{width:17px;height:17px}
    #snow-district-preview .sd-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:850;letter-spacing:.055em;border-radius:5px;padding:5px 8px;background:#e4f0e9;color:var(--sd-green);white-space:nowrap}
    #snow-district-preview .sd-badge.gold{background:var(--sd-yellow);color:var(--sd-navy)}
    #snow-district-preview .sd-badge.dark{background:#122d43df;color:#fff}
    #snow-district-preview .sd-badge.muted{background:#e5edf2;color:#526b7e}
    #snow-district-preview .sd-home{position:relative;padding:28px 4.5% 25px;min-height:485px;background:linear-gradient(180deg,#d3e6f1ee,#e3edf5f2),var(--sd-art-pinefall) center/cover}
    #snow-district-preview .sd-home-intro{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:21px}
    #snow-district-preview .sd-home-intro h1{font-size:clamp(22px,3.7vw,32px)}
    #snow-district-preview .sd-mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    #snow-district-preview .sd-mode{background:var(--sd-navy);color:#fff;border-radius:10px;overflow:hidden;position:relative;min-height:323px;box-shadow:0 6px 14px #142e4321;display:flex;flex-direction:column}
    #snow-district-preview .sd-mode-art{height:202px;background-size:cover;background-position:center;position:relative}
    #snow-district-preview .sd-mode-art:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--sd-navy),transparent 46%)}
    #snow-district-preview .sd-mode .sd-badge{position:absolute;z-index:1;top:13px;left:13px}
    #snow-district-preview .sd-mode-body{padding:0 17px 17px;display:flex;flex-direction:column;flex:1}
    #snow-district-preview .sd-mode-body h2{font-size:clamp(20px,2.9vw,28px);font-style:italic;text-transform:uppercase}
    #snow-district-preview .sd-mode-body p{font-size:11px;color:#c1d5e2;margin:5px 0 15px}
    #snow-district-preview .sd-mode-body button{width:100%;margin-top:auto;font-size:12px}
    #snow-district-preview .sd-art-town{background-image:var(--sd-art-pinefall)}
    #snow-district-preview .sd-art-quick{background-image:var(--sd-art-quick)}
    #snow-district-preview .sd-art-garage{background-image:var(--sd-art-garage)}
    #snow-district-preview .sd-art-mountains{background-image:var(--sd-art-mountains)}
    #snow-district-preview .sd-art-tractor{background-image:var(--sd-art-tractor)}
    #snow-district-preview .sd-art-loader{background-image:var(--sd-art-loader)}
    #snow-district-preview .sd-regions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    #snow-district-preview .sd-region{border:1px solid var(--sd-line);background:#fff;border-radius:9px;overflow:hidden;text-align:left;color:var(--sd-ink);padding:0;min-width:0;position:relative;box-shadow:0 3px 7px #102b4009}
    #snow-district-preview .sd-region.active{border:2px solid var(--sd-yellow)}
    #snow-district-preview .sd-region-picture{height:100px;background-size:cover;background-position:center;position:relative}
    #snow-district-preview .sd-region-picture .sd-badge{position:absolute;bottom:9px;left:11px}
    #snow-district-preview .sd-region-label{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    #snow-district-preview .sd-region-label strong{font-size:14px;font-weight:800}
    #snow-district-preview .sd-region-label small{font-size:10px;color:var(--sd-muted)}
    #snow-district-preview .sd-region:disabled{opacity:1;background:#e5edf2}
    #snow-district-preview .sd-region:disabled .sd-region-picture{filter:grayscale(.85);opacity:.32}
    #snow-district-preview .sd-region:disabled .sd-region-label{color:#637c8f}
    #snow-district-preview .sd-region-lock{position:absolute;inset:0 0 43px;display:flex;align-items:center;justify-content:center;color:var(--sd-navy)}
    #snow-district-preview .sd-region-lock svg{width:23px;height:23px}
    #snow-district-preview .sd-town-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}
    #snow-district-preview .sd-town-grid .sd-region-picture{height:218px}
    #snow-district-preview .sd-progress{height:5px;border-radius:6px;overflow:hidden;background:#dbe6ec;margin-top:12px}
    #snow-district-preview .sd-progress>span{display:block;height:100%;background:var(--sd-yellow)}
    #snow-district-preview .sd-job-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
    #snow-district-preview .sd-job{border:1px solid var(--sd-line);background:#fff;border-radius:10px;overflow:hidden;text-align:left;color:var(--sd-ink);padding:0;min-width:0}
    #snow-district-preview .sd-job.selected{border:2px solid #d59a00;box-shadow:0 0 0 2px #ffbd1729}
    #snow-district-preview .sd-job-picture{height:132px;background-size:cover;position:relative;background-position:center}
    #snow-district-preview .sd-job-picture .sd-badge{position:absolute;top:10px;left:10px}
    #snow-district-preview .sd-job-content{padding:15px}
    #snow-district-preview .sd-job-content p{font-size:11px;color:var(--sd-muted);margin-top:8px;min-height:33px}
    #snow-district-preview .sd-job-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:16px;font-size:11px;color:var(--sd-muted)}
    #snow-district-preview .sd-job-meta strong{color:#9a6900;font-size:17px}
    #snow-district-preview .sd-bottom-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:21px;padding-top:15px;border-top:1px solid var(--sd-line)}
    #snow-district-preview .sd-bottom-bar p{font-size:12px;color:var(--sd-muted)}
    #snow-district-preview .sd-machine-grid{display:grid;grid-template-columns:1fr 1fr;gap:19px}
    #snow-district-preview .sd-machine-choice{background:#fff;border:1px solid var(--sd-line);border-radius:10px;overflow:hidden}
    #snow-district-preview .sd-machine-choice.selected{border:2px solid #d59a00}
    #snow-district-preview .sd-machine-picture{height:200px;background-size:cover;background-position:50% 60%;position:relative}
    #snow-district-preview .sd-machine-picture .sd-badge{position:absolute;top:13px;left:13px}
    #snow-district-preview .sd-machine-caption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px}
    #snow-district-preview .sd-machine-caption h3{font-size:16px}
    #snow-district-preview .sd-machine-caption p{font-size:11px;color:var(--sd-muted);margin-top:5px}
    #snow-district-preview .sd-split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr);gap:20px}
    #snow-district-preview .sd-workshop{position:relative;background-size:cover;background-position:50% 55%;min-height:330px;border-radius:10px;overflow:hidden;border:1px solid #a4bac9}
    #snow-district-preview .sd-workshop:after{content:"";position:absolute;inset:60% 0 0;background:linear-gradient(0deg,#0c2439df,transparent);pointer-events:none}
    #snow-district-preview .sd-workshop-label{position:absolute;left:18px;bottom:16px;z-index:1;color:#fff}
    #snow-district-preview .sd-workshop-label small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c6dce8}
    #snow-district-preview .sd-workshop-label h2{margin-top:3px;font-size:22px}
    #snow-district-preview .sd-vehicle-switch{display:flex;gap:8px;margin-top:10px}
    #snow-district-preview .sd-vehicle-switch button{flex:1;min-height:40px;border:1px solid var(--sd-line);border-radius:7px;background:#fff;color:var(--sd-muted);font-weight:750;font-size:12px}
    #snow-district-preview .sd-vehicle-switch button.selected{background:var(--sd-navy);color:#fff;border-color:var(--sd-navy)}
    #snow-district-preview .sd-detail{padding:19px;background:#fff;border:1px solid var(--sd-line);border-radius:10px}
    #snow-district-preview .sd-tabs{display:flex;gap:4px;background:#e7eef3;border-radius:7px;padding:4px;margin-bottom:19px;flex-wrap:wrap}
    #snow-district-preview .sd-tabs button{flex:1;padding:9px 10px;background:none;border:0;border-radius:5px;font-size:11px;font-weight:800;color:var(--sd-muted);white-space:nowrap;min-height:34px}
    #snow-district-preview .sd-tabs button.active{background:#fff;color:var(--sd-ink);box-shadow:0 1px 5px #102b4012}
    #snow-district-preview .sd-statline{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;margin-top:16px}
    #snow-district-preview .sd-statline strong{font-size:14px;color:var(--sd-ink)}
    #snow-district-preview .sd-meter{height:5px;background:#e1eaf0;overflow:hidden;border-radius:4px;margin-top:7px}
    #snow-district-preview .sd-meter span{display:block;height:100%;background:#397f6a}
    #snow-district-preview .sd-detail .sd-primary,#snow-district-preview .sd-detail .sd-secondary{width:100%;margin-top:14px;font-size:12px}
    #snow-district-preview .sd-detail h2{font-size:24px}
    #snow-district-preview .sd-price{font-size:32px;font-weight:850;color:#a06c00;letter-spacing:-.05em;margin-top:15px}
    #snow-district-preview .sd-settings{display:grid;grid-template-columns:190px 1fr;gap:24px;max-width:770px;margin:0 auto}
    #snow-district-preview .sd-settings-nav{display:flex;flex-direction:column;gap:8px}
    #snow-district-preview .sd-settings-nav button{border:1px solid var(--sd-line);background:#e4edf3;color:var(--sd-ink);border-radius:7px;padding:13px 16px;text-align:left;font-weight:750;display:flex;align-items:center;gap:9px}
    #snow-district-preview .sd-settings-nav button.active{background:var(--sd-navy);color:#fff}
    #snow-district-preview .sd-setting-row{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #e2ebf1}
    #snow-district-preview .sd-setting-row label{font-size:13px;font-weight:700}
    #snow-district-preview .sd-setting-row p{font-size:11px;color:var(--sd-muted);margin-top:4px}
    #snow-district-preview .sd-setting-row input[type=range]{width:130px;accent-color:#d69a00}
    #snow-district-preview .sd-setting-row select{padding:8px;border:1px solid var(--sd-line);border-radius:6px;background:#edf3f7;color:var(--sd-ink);max-width:180px}
    #snow-district-preview .sd-toggle{width:40px;height:24px;border-radius:20px;border:0;background:var(--sd-navy);padding:3px;display:flex;justify-content:flex-end}
    #snow-district-preview .sd-toggle:after{content:"";width:18px;height:18px;border-radius:50%;background:var(--sd-yellow)}
    #snow-district-preview .sd-toggle[aria-pressed=false]{background:#adbfc9;justify-content:flex-start}
    #snow-district-preview .sd-driving{min-height:485px;position:relative;background:var(--sd-art-quick) center 58%/cover}
    #snow-district-preview .sd-driving:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b253554,transparent 25%,transparent 78%,#09223422);pointer-events:none}
    #snow-district-preview .sd-drive-top{position:relative;display:flex;justify-content:space-between;gap:12px;padding:18px 4%;color:#fff;text-shadow:0 1px 3px #071c32}
    #snow-district-preview .sd-drive-top>div{font-size:11px}
    #snow-district-preview .sd-drive-top strong{display:block;font-size:14px}
    #snow-district-preview .sd-drive-mission{min-width:155px;text-align:center}
    #snow-district-preview .sd-drive-button{position:absolute;width:58px;height:58px;border:0;background:none;padding:3px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 2px #081e3155)}
    #snow-district-preview .sd-drive-button img{max-width:100%;max-height:100%;object-fit:contain}
    #snow-district-preview .sd-steering-left{left:5%;bottom:5%}
    #snow-district-preview .sd-steering-right{left:calc(5% + 58px + 4%);bottom:5%}
    #snow-district-preview .sd-forward{right:5%;bottom:5%;width:74px;height:74px}
    #snow-district-preview .sd-reverse{right:calc(5% + 74px + 4%);bottom:5%}
    #snow-district-preview .sd-lift{right:5%;bottom:calc(5% + 74px + 5%)}
    #snow-district-preview .sd-blade-left{left:5%;bottom:calc(5% + 58px + 8%);width:46px;height:46px}
    #snow-district-preview .sd-blade-middle{left:calc(5% + 46px + 1.5%);bottom:calc(5% + 58px + 8%);width:46px;height:46px}
    #snow-district-preview .sd-blade-right{left:calc(5% + 92px + 3%);bottom:calc(5% + 58px + 8%);width:46px;height:46px}
    #snow-district-preview .sd-drive-camera{left:5%;top:17%;width:40px;height:40px}
    #snow-district-preview .sd-drive-garage{left:5%;top:28%;width:40px;height:40px}
    #snow-district-preview .sd-drive-pause{right:5%;top:17%;width:36px;height:36px}
    #snow-district-preview .sd-drive-lights{right:5%;top:31%;width:36px;height:36px}
    #snow-district-preview .sd-complete{position:absolute;top:44%;left:50%;transform:translateX(-50%);white-space:nowrap}
    #snow-district-preview .sd-pause{min-height:485px;position:relative;background:linear-gradient(90deg,#0b2539e8,#0b25397d),var(--sd-art-quick) center/cover;padding:30px 5%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:35px;color:#fff}
    #snow-district-preview .sd-pause h1{font-size:40px}
    #snow-district-preview .sd-pause .sd-eyebrow{color:#b0cbdc}
    #snow-district-preview .sd-pause p{color:#c3d6e1;margin-top:10px;font-size:13px}
    #snow-district-preview .sd-pause-actions{background:#f0f6fa;padding:20px;border-radius:12px;display:flex;flex-direction:column;gap:9px;max-width:330px;width:100%;justify-self:end}
    #snow-district-preview .sd-results{display:grid;grid-template-columns:1fr 1.25fr;gap:35px;max-width:770px;margin:12px auto}
    #snow-district-preview .sd-results-seal{background:var(--sd-navy);color:#fff;border-radius:12px;padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    #snow-district-preview .sd-results-seal>svg{width:55px;height:55px;color:var(--sd-yellow);margin-bottom:18px}
    #snow-district-preview .sd-results-seal .sd-eyebrow{color:#b9d2e1;margin-top:12px}
    #snow-district-preview .sd-result-line{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--sd-line);font-size:13px}
    #snow-district-preview .sd-result-total{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:16px;background:#ffedb6;border-radius:8px;font-weight:800}
    #snow-district-preview .sd-result-total strong{font-size:29px;letter-spacing:-.04em}
    #snow-district-preview .sd-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    #snow-district-preview .sd-actions>*{flex:1}
    #snow-district-preview .sd-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:35px;padding:9px 4.5%;font-size:9px;letter-spacing:.14em;font-weight:750;text-transform:uppercase;background:#dce8f0;color:#5b7384;border-top:1px solid #cad9e4}
    #snow-district-preview .sd-modal-host:empty{display:none}
    #snow-district-preview .sd-modal-host{position:absolute;inset:0;background:#061a2baf;z-index:12;display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(4px)}
    #snow-district-preview .sd-dialog{background:var(--sd-paper);color:var(--sd-ink);width:min(410px,100%);border-radius:12px;padding:25px;box-shadow:0 12px 60px #0006;border-top:5px solid var(--sd-yellow)}
    #snow-district-preview .sd-dialog p{color:var(--sd-muted);font-size:13px;margin-top:12px}
    #snow-district-preview .sd-dialog h2{font-size:26px}
    #snow-district-preview .sd-dialog-price{font-size:30px;font-weight:850;letter-spacing:-.04em;margin-top:15px}
    #snow-district-preview .sd-toast{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);background:var(--sd-navy);color:#fff;border-radius:8px;padding:10px 18px;max-width:85%;font-size:12px;z-index:15;box-shadow:0 4px 18px #0003;pointer-events:none}
    #snow-district-preview .sd-toast:empty{display:none}
    #snow-district-preview .sd-preview-caption{color:#688191;font-size:11px;margin-top:10px}

      if(state.screen==='towns')html=wrap(back('Career / Regions','regions')+heading('CAREER / ALPINE','Choose your town','Small towns. Big winters. Start your story in Pinefall.')+'<div class="sd-town-grid">'+regionCard('Pinefall','town',true,'0 / 3 contracts completed','jobs')+regionCard('Summit Village','mountains',false,'Coming later','')+regionCard('Timber Crossing','mountains',false,'Coming later','')+'</div>');
      if(state.screen==='jobs')html=wrap(back(state.mode==='Career'?'Career / Alpine / Pinefall':'Main Menu',state.mode==='Career'?'towns':'home')+heading(state.mode==='Career'?'PINEFALL CONTRACT BOARD':'QUICK JOB / PINEFALL','Choose a job','Clear at least 90% of the marked area to complete the job.')+'<div class="sd-job-grid">'+jobs.map((job,i)=>'<button class="sd-job '+(state.job===i?'selected':'')+'" data-job="'+i+'" aria-pressed="'+(state.job===i)+'"><div class="sd-job-picture sd-art-'+(i===1?'garage':'town')+'" style="background-position:'+job.position+'">'+badge(job.tag,'dark')+'</div><div class="sd-job-content"><h3>'+job.name+'</h3><p>'+job.description+'</p><div class="sd-job-meta"><span>'+job.time+'</span><strong>'+job.reward+' <small>coins</small></strong></div></div></button>').join('')+'</div><div class="sd-bottom-bar"><p>'+jobs[state.job].name+' · Your machine, your approach.</p>'+primary('Choose Machinery','data-go="machines"','tractor')+'</div>');
      if(state.screen==='machines')html=wrap(back('Job Selection','jobs')+heading(state.mode.toUpperCase()+' / '+jobs[state.job].name.toUpperCase(),'Choose your machinery','Select an owned machine to begin your shift.')+'<div class="sd-machine-grid">'+['tractor','loader'].map(v=>'<article class="sd-machine-choice '+(state.vehicle===v?'selected':'')+'"><div class="sd-machine-picture sd-art-'+v+'">'+badge(v==='tractor'||state.loaderOwned?'OWNED':'1,400 COINS',v==='tractor'||state.loaderOwned?'':'gold')+'</div><div class="sd-machine-caption"><div><h3>'+vehicleName(v)+'</h3><p>'+(v==='tractor'?'Front plow · Best for road clearing':'1.6 m³ bucket · Best for piles')+'</p></div>'+secondary(v==='loader'&&!state.loaderOwned?'View Shop':state.vehicle===v?'Selected':'Select',v==='loader'&&!state.loaderOwned?'data-go="shop"':'data-vehicle="'+v+'"')+'</div></article>').join('')+'</div><div class="sd-bottom-bar"><p>Pinefall · '+jobs[state.job].name+' · '+vehicleName(state.vehicle)+'</p>'+primary('Start Job','data-action="start"','play')+'</div>');
      if(state.screen==='garage'||state.screen==='shop'){
        const shop=state.screen==='shop',v=shop?'loader':state.garageVehicle,owned=v==='tractor'||state.loaderOwned;
        let detail='';
        if(shop)detail=badge(state.loaderOwned?'OWNED':'MACHINERY')+'<h2 style="margin-top:12px">Golden Snow Loader</h2><p class="sd-sub">Move piles, clear parking areas and transport snow to the disposal yard.</p><div class="sd-statline"><span>Bucket capacity</span><strong>1.6 m³</strong></div><div class="sd-statline"><span>Attachment</span><strong>Snow bucket</strong></div><div class="sd-price">1,400 <span style="font-size:14px;letter-spacing:0">coins</span></div>'+(state.loaderOwned?primary('View in Garage','data-action="owned-garage"'):primary('Purchase Loader','data-dialog="purchase"','shopping-cart'))+'<p class="sd-sub">One-time purchase · Available at the depot</p>';
        else{detail='<div class="sd-tabs">'+[['overview','Overview'],['service','Repair / Fuel'],['upgrades','Upgrades']].map(([id,title])=>'<button class="'+(state.garageTab===id?'active':'')+'" data-garage-tab="'+id+'">'+title+'</button>').join('')+'</div>'+badge(owned?'OWNED':'AVAILABLE IN SHOP',owned?'':'gold')+'<h2 style="margin-top:12px">'+vehicleName(v)+'</h2>';
          if(state.garageTab==='overview')detail+='<p class="sd-sub">'+(v==='tractor'?'Municipal front blade · Three plow angles':'Wide snow bucket · Automatic full-load carry')+'</p>'+meter('Fuel',state.fuel)+meter('Condition',state.condition)+(owned?primary('Select & Drive','data-action="select-drive"','play'):primary('View in Shop','data-go="shop"','shopping-cart'));
          if(state.garageTab==='service')detail+=meter('Fuel',state.fuel)+secondary('Refuel · '+((100-state.fuel)*2)+' coins','data-dialog="refuel"')+meter('Condition',state.condition)+secondary('Repair · '+((100-state.condition)*3)+' coins','data-dialog="repair"')+secondary('Recover to Depot','data-dialog="recover"');
          if(state.garageTab==='upgrades')detail+='<p class="sd-sub">Improve your selected machine at the depot.</p><div class="sd-statline"><span>Tyres · Level 0 / 3</span><strong>+12% grip</strong></div>'+secondary('Upgrade Tyres · 200','data-dialog="tyres"')+'<div class="sd-statline"><span>Engine · Level 0 / 3</span><strong>+18% torque</strong></div>'+secondary('Upgrade Engine · 200','data-dialog="engine"');
        }
        html=wrap(back('Main Menu','home')+heading(shop?'PINEFALL WORKSHOP / MACHINERY SHOP':'PINEFALL WORKSHOP',shop?'Built for the heavy work.':'Ready for another shift.')+'<div class="sd-split"><div><div class="sd-workshop sd-art-'+v+'"><div class="sd-workshop-label"><small>'+(shop?'MACHINERY SHOWROOM':'PINEFALL FLEET')+'</small><h2>'+vehicleName(v)+'</h2></div></div>'+(shop?'<div class="sd-vehicle-switch"><button class="selected">Machinery</button><button data-action="equipment">Equipment</button></div>':'<div class="sd-vehicle-switch">'+['tractor','loader'].map(m=>'<button class="'+(v===m?'selected':'')+'" data-garage-vehicle="'+m+'">'+(m==='tractor'?'Tractor':'Loader')+'</button>').join('')+'</div>')+'</div><aside class="sd-detail">'+detail+'</aside></div>'+(shop?'':'<div class="sd-bottom-bar"><p>Refuel, repair and fit upgrades at the depot.</p>'+secondary('Visit Machinery Shop','data-go="shop"')+'</div>'));
      }
      if(state.screen==='settings'){
        const tab=state.settingsTab;let body='';
        if(tab==='audio')body='<h2>Make yourself at home.</h2><div class="sd-setting-row"><div><label for="sd-master">Master volume</label><p>All game audio</p></div><input id="sd-master" type="range" min="0" max="100" value="80" aria-label="Master volume"></div><div class="sd-setting-row"><div><label for="sd-engine">Machinery volume</label><p>Engine and transmission</p></div><input id="sd-engine" type="range" min="0" max="100" value="75" aria-label="Machinery volume"></div><div class="sd-setting-row"><label>Music</label><button class="sd-toggle" data-action="toggle" aria-label="Music enabled" aria-pressed="true"></button></div><div class="sd-setting-row"><label>Sound effects</label><button class="sd-toggle" data-action="toggle" aria-label="Sound effects enabled" aria-pressed="true"></button></div>';
        if(tab==='graphics')body='<h2>A smooth winter shift.</h2><div class="sd-setting-row"><div><label for="sd-quality">Quality</label><p>Adjust for your device</p></div><select id="sd-quality"><option>Standard</option><option>Low</option></select></div><div class="sd-setting-row"><label>Frame-rate target</label><strong>30 FPS</strong></div><div class="sd-setting-row"><label>Menu camera motion</label><button class="sd-toggle" data-action="toggle" aria-label="Menu camera motion enabled" aria-pressed="true"></button></div><div class="sd-setting-row"><label>Performance readout</label><button class="sd-toggle" data-action="toggle" aria-label="Performance readout enabled" aria-pressed="false"></button></div>';
        if(tab==='controls')body='<h2>Comfortable controls.</h2><div class="sd-setting-row"><div><label>Directional pedals</label><p>Release to coast; both pedals brake.</p></div>'+badge('ENABLED')+'</div><div class="sd-setting-row"><div><label>Driving assistance</label><p>Traction and stability support</p></div><button class="sd-toggle" data-action="toggle" aria-label="Driving assistance enabled" aria-pressed="true"></button></div><div class="sd-setting-row"><label for="sd-text">Text size</label><select id="sd-text"><option>Standard</option><option>Large</option></select></div><div class="sd-setting-row"><label>Reduced motion</label><button class="sd-toggle" data-action="toggle" aria-label="Reduced motion enabled" aria-pressed="false"></button></div>';
        html=wrap(back('Back',state.returnTo||'home')+heading('PREFERENCES','Settings')+'<div class="sd-settings"><nav class="sd-settings-nav" aria-label="Settings categories">'+[['audio','Audio','volume-2'],['graphics','Graphics','monitor'],['controls','Controls','gamepad-2']].map(([id,title,symbol])=>'<button class="'+(tab===id?'active':'')+'" data-settings-tab="'+id+'">'+icon(symbol)+title+'</button>').join('')+'</nav><div class="sd-detail">'+body+'</div></div>');
      }
      if(state.screen==='gameplay')html=driving();
      if(state.screen==='pause')html='<div class="sd-pause"><div><div class="sd-eyebrow">PINEFALL / '+jobs[state.job].name.toUpperCase()+'</div><h1>Take a breather.</h1><p>Your shift is paused.<br>Your machine and snow will be waiting.</p></div><div class="sd-pause-actions">'+primary('Resume Job','data-go="gameplay"','play')+secondary('Garage','data-go="garage"')+secondary('Settings','data-go="settings"')+secondary('Recover to Depot','data-dialog="recover"')+'<button class="sd-danger" data-dialog="abandon">Abandon Job</button></div></div>';
      if(state.screen==='results')html=wrap(back('Main Menu','home')+heading('PINEFALL / SHIFT REPORT','A job well done.')+'<div class="sd-results"><div class="sd-results-seal">'+icon('award')+'<h2>'+jobs[state.job].name+'</h2><div class="sd-eyebrow">CONTRACT COMPLETE</div><p>96% cleared</p></div><div><div class="sd-result-line"><span>Contract payment</span><strong>'+jobs[state.job].reward+' coins</strong></div><div class="sd-result-line"><span>Completion bonus</span><strong>30 coins</strong></div><div class="sd-result-line"><span>Career progress</span><strong>1 / 3 Pinefall jobs</strong></div><div class="sd-result-total"><span>Coins earned</span><strong>+'+(jobs[state.job].reward+30)+'</strong></div><div class="sd-actions">'+secondary('Main Menu','data-go="home"')+primary('Next Job','data-go="jobs"')+'</div></div></div>');
      page.innerHTML=html;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
    }
    function showDialog(type){const configs={purchase:['Add it to your fleet?','Golden Snow Loader with a 1.6 m³ bucket. The machine will be available at your depot.',1400,'Purchase'],repair:['Repair this machine?','Restore condition to 100% at the workshop.',(100-state.condition)*3,'Repair'],refuel:['Fill the tank?','Refill your selected machine at the depot.',(100-state.fuel)*2,'Refuel'],recover:['Recover to the depot?','Your machine returns with its attachment raised. Loader snow stays near the pickup location. Fuel and condition stay unchanged.',null,'Recover'],abandon:['Leave this job?','Current job progress will be reset. Your purchased machinery stays in your fleet.',null,'Abandon Job'],tyres:['Upgrade your tyres?','Increase grip by 12% for the selected machine.',200,'Upgrade'],engine:['Upgrade your engine?','Increase available torque by 18% for the selected machine.',200,'Upgrade']};const [title,description,price,label]=configs[type];modal.innerHTML='<section class="sd-dialog" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="sd-eyebrow">'+(price===null?'CONFIRM ACTION':'WORKSHOP CONFIRMATION')+'</div><h2>'+title+'</h2><p>'+description+'</p>'+(price===null?'':'<div class="sd-dialog-price">'+price.toLocaleString()+' <span style="font-size:14px;letter-spacing:0">coins</span></div><p>Balance after purchase: '+(state.coins-price).toLocaleString()+' coins</p>')+'<div class="sd-actions">'+secondary('Cancel','data-action="cancel"')+primary(label,'data-confirm="'+type+'"')+'</div></section>';modal.querySelector('button').focus();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
    function confirm(type){const cost=type==='purchase'?1400:type==='repair'?(100-state.condition)*3:type==='refuel'?(100-state.fuel)*2:type==='tyres'||type==='engine'?200:0;if(cost>state.coins){notify('Not enough coins for this purchase.');return;}if(type==='purchase'){if(state.coins<1400){notify('Not enough coins for this purchase.');return;}state.coins-=1400;state.loaderOwned=true;state.garageVehicle='loader';state.vehicle='loader';}if(type==='repair'){state.coins-=(100-state.condition)*3;state.condition=100;}if(type==='refuel'){state.coins-=(100-state.fuel)*2;state.fuel=100;}if(type==='tyres'||type==='engine'){state.coins-=200;}modal.innerHTML='';if(type==='recover'){go('gameplay');notify('Recovered to depot · attachment Up');return;}if(type==='abandon'){state.cleared=0;go('home');return;}render();notify(type==='purchase'?'Loader added to your fleet.':type==='repair'?'Machine repaired.':type==='refuel'?'Tank refilled.':'Upgrade fitted.');}
    root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;
      if(b.dataset.go){if(b.dataset.go==='settings')state.returnTo=state.screen;if(b.dataset.go==='regions')state.mode='Career';go(b.dataset.go);return;}
      if(b.dataset.dialog){showDialog(b.dataset.dialog);return;}if(b.dataset.confirm){confirm(b.dataset.confirm);return;}
      if(b.dataset.job!==undefined){state.job=Number(b.dataset.job);render();return;}if(b.dataset.vehicle){state.vehicle=b.dataset.vehicle;render();persist();return;}if(b.dataset.garageVehicle){state.garageVehicle=b.dataset.garageVehicle;render();return;}if(b.dataset.garageTab){state.garageTab=b.dataset.garageTab;render();return;}if(b.dataset.settingsTab){state.settingsTab=b.dataset.settingsTab;render();return;}
      const action=b.dataset.action;if(action==='quick'){state.mode='Quick Job';go('jobs');}if(action==='continue')go('gameplay');if(action==='cancel')modal.innerHTML='';if(action==='mute'){state.muted=!state.muted;notify(state.muted?'Sound off':'Sound on');}if(action==='toggle')b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');if(action==='owned-garage'){state.garageVehicle='loader';state.garageTab='overview';go('garage');}if(action==='select-drive'){state.vehicle=state.garageVehicle;go('gameplay');notify('Machine selected.');}if(action==='equipment')notify('Your current blade and bucket are included with their machines.');if(action==='start'){modal.innerHTML='<section class="sd-dialog" role="dialog" aria-label="Loading Pinefall"><div class="sd-eyebrow">ALPINE / PINEFALL</div><h2>Getting your machine ready.</h2><p>'+jobs[state.job].name+' · '+vehicleName(state.vehicle)+'</p><div class="sd-progress"><span style="width:76%"></span></div></section>';setTimeout(()=>{state.cleared=0;go('gameplay');},650);}if(action==='drive'){state.cleared=Math.min(96,state.cleared+24);render();}if(action==='reverse')notify('Reverse · brakes to a stop before changing direction.');if(action==='pause')go('pause');if(action==='garage')go('garage');if(action==='camera')notify('Camera: Isometric → Follow → Orbit');if(action==='lights')notify('Headlights toggled.');if(action==='lift')notify(state.vehicle==='loader'?'Lift: unload, then lower to collect.':'Blade height toggled.');if(action==='dump')notify('Dump: unload, then keep bucket Up.');if(action==='blade')notify('Blade direction selected.');
    });
    picker.innerHTML=screens.map(([id,title])=>'<option value="'+id+'">'+title+'</option>').join('');picker.addEventListener('change',()=>go(picker.value));
    root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(modal.innerHTML)modal.innerHTML='';else if(state.screen==='gameplay')go('pause');}});
    if(window.openai?.widgetState?.privateContent?.screen&&screens.some(([id])=>id===window.openai.widgetState.privateContent.screen))state.screen=window.openai.widgetState.privateContent.screen;
    window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent?.screen;if(saved&&screens.some(([id])=>id===saved)){state.screen=saved;render();}});
    function appearance(){root.style.setProperty('--sd-yellow',look.accent);root.style.setProperty('--sd-radius',look.radius+'px');}appearance();render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:appearance});tweak.addColorPicker(look,'accent',{label:'Action accent',reference:'snowdistrict.accent'});tweak.addSlider(look,'radius',{label:'Outer corner radius',min:0,max:20,step:1,unit:'px'});}
  })();
  </script>
